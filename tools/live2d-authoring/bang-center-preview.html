<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" />
  <title>长离 · 中央刘海制作核对</title>
  <style>
    body {
      background: #fff6f2;
      color: #543b39;
      font: 16px system-ui;
      text-align: center;
    }
    canvas {
      width: min(80vw, 50vh, 650px);
      height: min(80vw, 50vh, 650px);
    }
    button {
      padding: 10px;
      margin: 5px;
    }
    pre {
      text-align: left;
      max-width: 900px;
      margin: auto;
      white-space: pre-wrap;
    }
    output {
      display: block;
      margin: 8px;
    }
    details {
      max-width: 900px;
      margin: auto;
    }
  </style>
  <h1>中央刘海 · 隔离候选</h1>
  <p>官方 Cubism Editor 导出；美术仍是草稿。本页验证浏览器 Core，不代表 Windows 桌面验收。</p>
  <canvas id="model" width="800" height="800"></canvas>
  <div>
    <button id="minus">刘海 -1</button><button id="zero">归零</button
    ><button id="plus">刘海 +1</button><button id="wing">刘海与翅膀组合</button
    ><button id="tail">刘海与尾羽组合</button><button id="impulse">八组物理回弹</button>
  </div>
  <output id="summary">读取真实 Core 顶点…</output
  ><output id="runtime">尚未执行实际渲染回弹。</output>
  <details>
    <summary>完整验证数据</summary>
    <pre id="report"></pre>
  </details>
  <script type="module">
    import { loadCubismCore } from '/src/renderer/live2d/CoreLoader.ts';
    const root = '/models/changli/live-bang-center-v1-candidate/';
    const name = 'ChangliBangCenterV1';
    try {
      await loadCubismCore();
      const { CubismBackend } = await import('/src/renderer/live2d/CubismBackend.ts');
      const { CubismMoc } = await import('/vendor/live2d/src/model/cubismmoc.ts');
      const { CubismPhysics } = await import('/vendor/live2d/src/physics/cubismphysics.ts');
      let backend,
        mode,
        runId = 0;
      const loadPreview = async (nextMode) => {
        runId++;
        backend?.dispose();
        backend = new CubismBackend();
        mode = nextMode;
        await backend.load(
          document.getElementById('model'),
          root + name + (mode === 'physics' ? '-physics' : '') + '.model3.json',
        );
        backend.resize(800, 800);
      };
      await loadPreview('manual');
      const mocBytes = await (await fetch(root + name + '.moc3')).arrayBuffer();
      const moc = CubismMoc.create(mocBytes, true);
      const model = moc.createModel(),
        core = model.getModel(),
        ids = core.parameters.ids;
      const snap = () => core.drawables.vertexPositions.map((v) => [...v]);
      const reset = () => {
        core.parameters.values.set(core.parameters.defaultValues);
        core.update();
      };
      reset();
      const base = snap(),
        ppu = model.getPixelsPerUnit();
      const sample = (params) => {
        reset();
        for (const [id, v] of Object.entries(params)) {
          const i = ids.indexOf(id);
          if (i < 0) throw Error('Missing ' + id);
          core.parameters.values[i] = v;
        }
        core.update();
        const positions = snap();
        return positions.flatMap((v, i) => {
          const delta = v.map((x, j) => (x - base[i][j]) * ppu);
          if (Math.max(...delta.map(Math.abs)) < 0.001) return [];
          const xy = [0, 1].map((axis) => delta.filter((_, j) => j % 2 === axis));
          return [
            {
              id: core.drawables.ids[i],
              shiftPixels: xy.map((a) => a.reduce((x, y) => x + y, 0) / a.length),
              spreadPixels: xy.map((a) => Math.max(...a) - Math.min(...a)),
            },
          ];
        });
      };
      const minus = sample({ ParamBangCenterSway: -1 }),
        plus = sample({ ParamBangCenterSway: 1 });
      const bangIndex = core.drawables.ids.indexOf('ArtMesh17');
      if (bangIndex < 0) throw Error('Missing bang ArtMesh17');
      const vertexSample = (value) => {
        reset();
        core.parameters.values[ids.indexOf('ParamBangCenterSway')] = value;
        core.update();
        return [...core.drawables.vertexPositions[bangIndex]].reduce((rows, x, j, all) => {
          if (j % 2 === 0) rows.push({
            x: base[bangIndex][j] * ppu,
            y: base[bangIndex][j + 1] * ppu,
            dx: (x - base[bangIndex][j]) * ppu,
            dy: (all[j + 1] - base[bangIndex][j + 1]) * ppu,
          });
          return rows;
        }, []);
      };
      const endpoints = [-1, -.5, .5, 1].map(value => ({value, vertices: vertexSample(value)}));
      const ys = endpoints[0].vertices.map(v => v.y), top = Math.max(...ys), bottom = Math.min(...ys);
      const metrics = endpoints.map(row => {
        const roots = row.vertices.filter(v => v.y >= top - .01);
        const tips = row.vertices.filter(v => v.y <= bottom + .01);
        return { value: row.value,
          rootMaxPixels: Math.max(...roots.map(v => Math.hypot(v.dx, v.dy))),
          tipMeanDxPixels: tips.reduce((n,v) => n + v.dx, 0) / tips.length,
          tipMaxDyPixels: Math.max(...tips.map(v => Math.abs(v.dy))),
        };
      });
      const onlyBang = rows => rows.length === 1 && rows[0].id === 'ArtMesh17';
      const opposing = metrics[0].tipMeanDxPixels * metrics[3].tipMeanDxPixels < 0;
      const anchored = metrics.every(v => v.rootMaxPixels <= .5);
      const interpolates = Math.abs(metrics[1].tipMeanDxPixels) < Math.abs(metrics[0].tipMeanDxPixels) &&
        Math.abs(metrics[2].tipMeanDxPixels) < Math.abs(metrics[3].tipMeanDxPixels);
      const wing = sample({ ParamPhoenixWingSway: 30 }), tail = sample({ ParamPhoenixTailSway: 30 });
      const float = sample({ ParamPhoenixSway: 30 });
      const independent = wing.length === 1 && wing[0].id === 'ArtMesh15' &&
        tail.length === 1 && tail[0].id === 'ArtMesh8' &&
        JSON.stringify(float.map(v=>v.id).sort()) === JSON.stringify(['ArtMesh8','ArtMesh15','ArtMesh16'].sort());
      const combinations = [sample({ParamBangCenterSway:1,ParamPhoenixWingSway:30}),
        sample({ParamBangCenterSway:-1,ParamPhoenixTailSway:30})];
      const composed = combinations.every(rows => rows.length === 2 && rows.some(v=>v.id==='ArtMesh17'));
      reset();
      const resetResidualPixels = Math.max(...snap().flatMap((v,i)=>v.map((x,j)=>Math.abs(x-base[i][j])*ppu)));
      const result = {status: onlyBang(minus) && onlyBang(plus) && opposing && anchored && interpolates &&
        independent && composed && resetResidualPixels < .01 ? 'PASS' : 'FAIL',
        anchored, opposing, interpolates, independent, composed, minus, plus, metrics, endpoints,
        wing, tail, float, combinations, resetResidualPixels, rootTolerancePixels:.5,
        artMeshes:core.drawables.count, parameters:ids.length, candidateOnly:true};
      const physicsManifest = await (await fetch(root + name + '-physics.model3.json')).json();
      const physicsBytes = await (
        await fetch(root + physicsManifest.FileReferences.Physics)
      ).arrayBuffer();
      const physics = CubismPhysics.create(physicsBytes, physicsBytes.byteLength);
      const outputs = JSON.parse(new TextDecoder().decode(physicsBytes)).PhysicsSettings.map(
        (s) => s.Output[0].Destination.Id,
      );
      const tracked = ['ParamBangCenterSway', 'ParamPhoenixSway', 'ParamPhoenixWingSway', 'ParamPhoenixTailSway'];
      const ranges = Object.fromEntries(tracked.map((id) => [id, [0, 0]]));
      reset();
      physics.stabilization(model);
      model.update();
      const rest = snap();
      for (let frame = 0; frame < 1200; frame++) {
        core.parameters.values[ids.indexOf('ParamAngleX')] =
          frame < 12 ? 0 : frame < 30 ? 30 : frame < 48 ? -30 : 0;
        physics.evaluate(model, 1 / 60);
        model.update();
        for (const id of tracked) {
          const value = core.parameters.values[ids.indexOf(id)];
          if (!Number.isFinite(value) || Math.abs(value) > 30.001)
            throw Error('Physics out of range ' + id);
          ranges[id][0] = Math.min(ranges[id][0], value);
          ranges[id][1] = Math.max(ranges[id][1], value);
        }
      }
      const residualPixels = Math.max(
        ...snap().flatMap((v, i) => v.map((x, j) => Math.abs(x - rest[i][j]) * ppu)),
      );
      const final = Object.fromEntries(
        ['ParamAngleX', ...outputs].map((id) => [id, core.parameters.values[ids.indexOf(id)]]),
      );
      result.fixedPhysics = {
        status:
          outputs.length === 8 &&
          Object.values(ranges).every((a) => a[0] < -0.01 && a[1] > 0.01) &&
          residualPixels <= 0.25
            ? 'PASS'
            : 'FAIL',
        frames: 1200,
        ranges,
        final,
        residualPixels,
        residualTolerancePixels: 0.25,
      };
      if (result.fixedPhysics.status !== 'PASS') result.status = 'FAIL';
      const publish = () => {
        document.getElementById('summary').textContent =
          result.status + ' · 发根约束、双向刘海、独立翼尾、归零与八组物理';
        document.getElementById('report').textContent = JSON.stringify(result, null, 2);
      };
      publish();
      window.bangCenterVerification = result;
      const pose = async (bang = 0, w = 0, t = 0) => {
        runId++;
        if (mode !== 'manual') await loadPreview('manual');
        backend.setParameter('ParamBangCenterSway', bang);
        backend.setParameter('ParamPhoenixWingSway', w);
        backend.setParameter('ParamPhoenixTailSway', t);
        window.scrollTo(0, 0);
      };
      document.getElementById('minus').onclick = () => pose(-1);
      document.getElementById('plus').onclick = () => pose(1);
      document.getElementById('zero').onclick = () => pose();
      document.getElementById('wing').onclick = () => pose(1, 30);
      document.getElementById('tail').onclick = () => pose(-1, 0, 30);
      document.getElementById('impulse').onclick = async () => {
        const controls = [...document.querySelectorAll('button')];
        controls.forEach((b) => (b.disabled = true));
        try {
          await loadPreview('physics');
          const run = ++runId;
          backend.setParameter('ParamAngleX', 30);
          const started = performance.now();
          let previous = started,
            seconds = 0,
            frames = 0,
            reversed = false,
            released = false;
          const liveRanges = Object.fromEntries(tracked.map((id) => [id, [0, 0]]));
          const sample = (now) => {
            if (run !== runId) return;
            seconds += Math.min((now - previous) / 1000, 0.1);
            previous = now;
            frames++;
            const values = backend.getParameterSnapshot();
            for (const id of tracked) {
              const v = values[id];
              if (!Number.isFinite(v) || Math.abs(v) > 30.001) {
                document.getElementById('runtime').textContent = 'FAIL: invalid ' + id;
                controls.forEach((b) => (b.disabled = false));
                return;
              }
              liveRanges[id][0] = Math.min(liveRanges[id][0], v);
              liveRanges[id][1] = Math.max(liveRanges[id][1], v);
            }
            if (!reversed && seconds >= 0.3) {
              backend.setParameter('ParamAngleX', -30);
              reversed = true;
            }
            if (!released && seconds >= 0.6) {
              backend.setParameter('ParamAngleX', 0);
              released = true;
            }
            if (seconds < 20) {
              document.getElementById('runtime').textContent =
                '实际渲染回弹采样 ' + seconds.toFixed(2) + ' / 20 秒动画时间';
              requestAnimationFrame(sample);
              return;
            }
            reset();
            const liveRest = snap();
            for (const [id, value] of Object.entries(values)) {
              const index = ids.indexOf(id);
              if (index >= 0) core.parameters.values[index] = value;
            }
            core.update();
            const residual = Math.max(
              ...snap().flatMap((v, i) => v.map((x, j) => Math.abs(x - liveRest[i][j]) * ppu)),
            );
            result.renderedImpulse = {
              status:
                frames >= 60 &&
                values.ParamAngleX === 0 &&
                Number.isFinite(residual) &&
                residual <= 0.25 &&
                Object.values(liveRanges).every((a) => a[0] < -0.01 && a[1] > 0.01)
                  ? 'PASS'
                  : 'FAIL',
              frames,
              animationSeconds: seconds,
              elapsedMs: now - started,
              ranges: liveRanges,
              final: Object.fromEntries(['ParamAngleX', ...outputs].map((id) => [id, values[id]])),
              residualPixels: residual,
              residualTolerancePixels: 0.25,
            };
            document.getElementById('runtime').textContent =
              result.renderedImpulse.status +
              ' · 实际八组物理回弹，残差 ' +
              residual.toFixed(4) +
              ' 源像素';
            publish();
            controls.forEach((b) => (b.disabled = false));
          };
          requestAnimationFrame(sample);
        } catch (error) {
          document.getElementById('runtime').textContent = 'FAIL: ' + error;
          controls.forEach((b) => (b.disabled = false));
        }
      };
      physics.release();
      window.addEventListener(
        'pagehide',
        () => {
          runId++;
          backend.dispose();
          moc.deleteModel(model);
          moc.release();
        },
        { once: true },
      );
    } catch (e) {
      document.getElementById('report').textContent = 'FAIL: ' + e;
    }
  </script>
</html>
