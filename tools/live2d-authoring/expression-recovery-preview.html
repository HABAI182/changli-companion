<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" />
  <link rel="icon" href="data:," />
  <title>长离 · 表情恢复验证</title>
  <style>
    body {
      font: 16px system-ui;
      background: #fff6f2;
      color: #543b39;
      text-align: center;
    }
    canvas {
      width: min(80vw, 60vh, 650px);
      height: min(80vw, 60vh, 650px);
    }
    button {
      padding: 10px;
      margin: 6px;
    }
    pre {
      white-space: pre-wrap;
      max-width: 900px;
      margin: auto;
      text-align: left;
    }
  </style>
  <h1>Live2D 表情恢复核对</h1>
  <p>实际表现层 → 适配器 → 官方 Cubism 后端。只验证运行行为；左发、脸型与闭眼弧线仍待精修。</p>
  <canvas id="model" width="1200" height="1200"></canvas>
  <div><button id="run" disabled>运行笑脸 → 未制作表情 → 中性检查</button></div>
  <p id="status">正在加载现有隔离模型…</p>
  <details open>
    <summary>验证记录</summary>
    <pre id="report"></pre>
  </details>
  <script type="module">
    import { loadCubismCore } from '/src/renderer/live2d/CoreLoader.ts';
    const button = document.getElementById('run'),
      status = document.getElementById('status');
    let adapter;
    try {
      await loadCubismCore();
      const { CubismBackend } = await import('/src/renderer/live2d/CubismBackend.ts');
      const { Live2DAdapter } = await import('/src/renderer/live2d/Live2DAdapter.ts');
      const { PresentationRuntime } = await import('/src/pet/presentation.ts');
      const backend = new CubismBackend();
      const expressionCalls = [];
      // Observe the real calls while preserving all actual backend behavior.
      const setExpression = backend.setExpression.bind(backend);
      backend.setExpression = (name) => {
        expressionCalls.push(name);
        setExpression(name);
      };
      adapter = new Live2DAdapter(
        {
          entry: 'live-eye-gaze-v1-candidate/ChangliEyeGazeV1-physics.model3.json',
          parameterMap: {
            'eye.left.open': 'ParamEyeLOpen',
            'eye.right.open': 'ParamEyeROpen',
            'mouth.open': 'ParamMouthOpenY',
            'mouth.form': 'ParamMouthForm',
          },
          motionMap: {},
          expressionMap: { default: 'Neutral', smile: 'Smile', serious: 'Neutral' },
        },
        backend,
      );
      if ((await adapter.init(document.getElementById('model'))) !== 'ready')
        throw Error(adapter.error || 'Model failed');
      backend.resize(1200, 1200);
      const pet = new PresentationRuntime(0, () => 0);
      const settings = { motion: 'full', inputMode: 'keyboard_mouse', autoSleepMinutes: 0 };
      function choose(id) {
        pet.expression(id, 'toggle', true, 0);
        adapter.update(pet.snapshot(0, settings));
      }
      const report = {
        candidate: 'ChangliEyeGazeV1',
        actualBackend: true,
        artApproved: false,
        stages: [],
        pass: null,
      };
      function publish() {
        document.getElementById('report').textContent = JSON.stringify(report, null, 2);
      }
      async function settle(id) {
        choose(id);
        const start = performance.now();
        let frames = 0;
        await new Promise((resolve) => {
          function frame(now) {
            frames++;
            if (now - start >= 1100) resolve();
            else requestAnimationFrame(frame);
          }
          requestAnimationFrame(frame);
        });
        const p = backend.getParameterSnapshot();
        return {
          requested: id,
          frames,
          elapsedMs: performance.now() - start,
          parameters: {
            left: p.ParamEyeLOpen,
            right: p.ParamEyeROpen,
            mouth: p.ParamMouthOpenY,
            form: p.ParamMouthForm,
          },
          calls: [...expressionCalls],
        };
      }
      choose('default');
      button.disabled = false;
      status.textContent = '模型已加载，准备验证真实表情恢复。';
      publish();
      button.onclick = async () => {
        button.disabled = true;
        status.textContent = '正在运行真实表情淡入/淡出…';
        try {
          pet.expression('default', 'toggle', true, 0);
          expressionCalls.length = 0;
          report.stages = [];
          for (const id of ['smile', 'think', 'serious', 'default', 'smile', 'default']) {
            report.stages.push(await settle(id));
            publish();
          }
          const [smile, think, serious, neutral, again, restored] = report.stages;
          const open = (row) =>
            Math.abs(row.parameters.left - 1) < 0.005 &&
            Math.abs(row.parameters.right - 1) < 0.005 &&
            Math.abs(row.parameters.form) < 0.005;
          const closed = (row) =>
            Math.abs(row.parameters.left) < 0.005 && Math.abs(row.parameters.right) < 0.005;
          report.pass =
            closed(smile) &&
            open(think) &&
            open(serious) &&
            open(neutral) &&
            closed(again) &&
            open(restored) &&
            JSON.stringify(expressionCalls) ===
              JSON.stringify(['Smile', 'Neutral', 'Smile', 'Neutral']) &&
            report.stages.every((s) => s.frames > 5);
          report.expressionCalls = [...expressionCalls];
          publish();
          status.textContent =
            (report.pass ? 'PASS' : 'FAIL') +
            '：笑脸可释放，未制作表情回到中性，别名不重复启动淡入。';
        } catch (error) {
          report.error = String(error);
          report.pass = false;
          publish();
          status.textContent = 'FAIL: ' + error;
        } finally {
          button.disabled = false;
        }
      };
    } catch (error) {
      status.textContent = 'ERROR: ' + error;
    }
    addEventListener('pagehide', () => adapter?.dispose(), { once: true });
  </script>
</html>
