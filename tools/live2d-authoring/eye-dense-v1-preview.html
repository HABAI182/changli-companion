<!doctype html><html lang="zh-CN"><meta charset="utf-8"><link rel="icon" href="data:,">
<title>长离 · 眼部细分与绑定回归核对</title>
<style>body{background:#fff6f2;color:#543b39;font:16px system-ui;text-align:center}canvas{width:min(85vw,65vh,750px);height:min(85vw,65vh,750px)}button{padding:10px;margin:5px}pre{max-width:1000px;margin:auto;text-align:left;white-space:pre-wrap}</style>
<h1>眼白与轮廓网格细分 · 隔离候选</h1><p>四个眼部网格由 4 点细分到 25 点；真实 Editor 导出与 Core 验证。闭眼弧线、补绘融合仍是草稿，尚未进入默认或 Windows 包。</p>
<canvas id="model" width="1200" height="1200"></canvas>
<div><button id="neutral">中性</button><button id="left">左视</button><button id="right">右视</button><button id="up">上视</button><button id="down">下视</button><button id="diagonal">斜视半闭</button><button id="animate">视线叠加眨眼</button></div>
<p id="summary">读取真实 Cubism Core（细分候选）…</p><p id="runtime"></p><details><summary>验证数据</summary><pre id="report"></pre></details>
<script type="module">
import {loadCubismCore} from '/src/renderer/live2d/CoreLoader.ts';
try {
 await loadCubismCore();
 const {CubismMoc}=await import('/vendor/live2d/src/model/cubismmoc.ts');
 const {CubismBackend}=await import('/src/renderer/live2d/CubismBackend.ts');
 const {Live2DAdapter}=await import('/src/renderer/live2d/Live2DAdapter.ts');
 const {PresentationRuntime}=await import('/src/pet/presentation.ts');
 const root='/models/changli/live-eye-dense-v1-candidate/',name='ChangliEyeDenseV1';
 const backend=new CubismBackend();
 const adapter=new Live2DAdapter({entry:'live-eye-dense-v1-candidate/'+name+'.model3.json',parameterMap:{'eye.x':'ParamEyeBallX','eye.y':'ParamEyeBallY','eye.left.open':'ParamEyeLOpen','eye.right.open':'ParamEyeROpen'},motionMap:{},expressionMap:{}},backend);
 if(await adapter.init(document.getElementById('model'))!=='ready')throw Error(adapter.error||'Adapter failed');backend.resize(1200,1200);
 const presentation=new PresentationRuntime(0,()=>0);
 const moc=CubismMoc.create(await(await fetch(root+name+'.moc3')).arrayBuffer(),true), model=moc.createModel(),core=model.getModel(),ppu=model.getPixelsPerUnit();
 const previousMoc=CubismMoc.create(await(await fetch('/models/changli/live-eye-gaze-v1-candidate/ChangliEyeGazeV1.moc3')).arrayBuffer(),true),previousModel=previousMoc.createModel(),old=previousModel.getModel();
 const ids=[...core.drawables.ids],irises=['ArtMesh23','ArtMesh24'],at=id=>ids.indexOf(id);
 function set(c,p={}){c.parameters.values.set(c.parameters.defaultValues);for(const[id,v]of Object.entries(p)){const i=c.parameters.ids.indexOf(id);if(i<0)throw Error('Missing '+id);c.parameters.values[i]=v;}c.update();return c.drawables.vertexPositions.map(v=>[...v]);}
 const base=set(core),diff=(a,b)=>Math.max(0,...a.map((v,i)=>Math.abs(v-b[i])*ppu));
 function translation(a,b){const xs=[],ys=[];for(let i=0;i<a.length;i+=2){xs.push((a[i]-b[i])*ppu);ys.push((a[i+1]-b[i+1])*ppu);}const mean=v=>v.reduce((a,b)=>a+b,0)/v.length;return {x:mean(xs),y:mean(ys),nonRigid:Math.max(Math.max(...xs)-Math.min(...xs),Math.max(...ys)-Math.min(...ys))};}
 const axes=['ParamEyeBallX','ParamEyeBallY'].flatMap(param=>[-1,-.5,0,.5,1].map(value=>{const pos=set(core,{[param]:value}),moves=irises.map(id=>({id,...translation(pos[at(id)],base[at(id)])})),changed=ids.filter((id,i)=>diff(pos[i],base[i])>.001);return {param,value,changed,moves,pass:changed.every(id=>irises.includes(id))&&changed.length===(value===0?0:2)&&moves.every(m=>m.nonRigid<.001&&(param.endsWith('X')?Math.abs(m.y)<.001:Math.abs(m.x)<.001))};}));
 const combinations=[-1,-.5,0,.5,1].flatMap(x=>[-1,-.5,0,.5,1].map(y=>{const xy=set(core,{ParamEyeBallX:x,ParamEyeBallY:y}),xp=set(core,{ParamEyeBallX:x}),yp=set(core,{ParamEyeBallY:y});let residual=0;for(const id of irises){const i=at(id);residual=Math.max(residual,...xy[i].map((v,j)=>Math.abs(v-xp[i][j]-yp[i][j]+base[i][j])*ppu));}return {x,y,residualPixels:residual,pass:residual<.001};}));

 const refined=['ArtMesh25','ArtMesh26','EyeLeft2','EyeRight2'];
 // Compare each new vertex to the old triangle surface at the SAME UV.
 // A topology change must not conceal changed old corners or unrelated meshes.
 function geometryDifference(i,j,a,b){
   if(!refined.includes(ids[i])){if(a.length!==b.length)throw Error('Unexpected topology change');return diff(a,b);}
   if(a.length!==50||b.length!==8)throw Error('Expected 4 -> 25 subdivision');
   const uv=core.drawables.vertexUvs[i],ov=old.drawables.vertexUvs[j],tri=old.drawables.indices[j];let max=0;
   for(let k=0;k<uv.length;k+=2){
     const x=uv[k],y=uv[k+1];let expected=null;
     for(let t=0;t<tri.length;t+=3){
       const p=tri[t]*2,q=tri[t+1]*2,r=tri[t+2]*2;
       const ax=ov[p],ay=ov[p+1],bx=ov[q],by=ov[q+1],cx=ov[r],cy=ov[r+1];
       const den=(by-cy)*(ax-cx)+(cx-bx)*(ay-cy);
       if(Math.abs(den)<1e-12)continue;
       const u=((by-cy)*(x-cx)+(cx-bx)*(y-cy))/den;
       const v=((cy-ay)*(x-cx)+(ax-cx)*(y-cy))/den,w=1-u-v;
       if(Math.min(u,v,w)<-1e-4)continue;
       expected=[u*b[p]+v*b[q]+w*b[r],u*b[p+1]+v*b[q+1]+w*b[r+1]];break;
     }
     if(!expected)throw Error('New UV escaped baseline surface');
     max=Math.max(max,Math.abs(a[k]-expected[0])*ppu,Math.abs(a[k+1]-expected[1])*ppu);
   }return max;
 }
 const topology=ids.map((id,i)=>({id,vertices:core.drawables.vertexCounts[i],baselineVertices:old.drawables.vertexCounts[old.drawables.ids.indexOf(id)]}));
 const topologyPass=ids.length===old.drawables.ids.length&&refined.every(id=>core.drawables.vertexCounts[at(id)]===25);

 const regressions=[{}, {ParamAngleZ:-30}, {ParamEyeLOpen:0,ParamEyeROpen:1}, {ParamEyeLOpen:.5,ParamEyeROpen:.5}, {ParamAngleZ:30,ParamBangCenterSway:1,ParamSideHairLeftSway:-1,ParamSideHairRightSway:1,ParamOrnamentLeftSway:1,ParamHandLeftPress:30,ParamHandRightPress:30,ParamPhoenixSway:30,ParamPhoenixWingSway:30,ParamPhoenixTailSway:30}].map(params=>{const a=set(core,params),b=set(old,params);let max=0;for(let j=0;j<old.drawables.ids.length;j++){const i=at(old.drawables.ids[j]);if(i<0)throw Error('Missing baseline drawable');max=Math.max(max,geometryDifference(i,j,a[i],b[j]));}return {params,maxDifferencePixels:max,pass:max<.01};});
 const blinkCombinations=[0,.25,.5,.75,1].flatMap(open=>[-1,1].flatMap(x=>[-1,1].map(y=>{const p={ParamEyeLOpen:open,ParamEyeROpen:open},neutral=set(core,p),gaze=set(core,{...p,ParamEyeBallX:x,ParamEyeBallY:y});const changed=ids.filter((id,i)=>diff(gaze[i],neutral[i])>.001);const masks=irises.map(id=>{const i=at(id);return {id,mask:[...core.drawables.masks[i]].slice(0,core.drawables.maskCounts[i]).map(j=>ids[j]),inverted:model.getDrawableInvertedMaskBit(i),opacity:core.drawables.opacities[i]};});return {open,x,y,changed,masks,pass:changed.length===2&&changed.every(id=>irises.includes(id))&&masks.every(m=>m.mask.length===1&&!m.inverted&&m.opacity===1)};})));
 set(core,{ParamEyeBallX:1,ParamEyeBallY:-1,ParamEyeLOpen:0});const returned=set(core),returnResidual=Math.max(...returned.map((v,i)=>diff(v,base[i])));
 const directionPass=axes.filter(c=>Math.abs(c.value)===1).every(c=>c.moves.every(m=>c.param.endsWith('X')?m.x*c.value>1:m.y*c.value>1));
 const report={candidate:name,officialCore:true,topology,topologyPass,drawables:ids.length,parameters:core.parameters.count,axes,combinations,regressions,blinkCombinations,directionPass,returnResidual,pass:topologyPass&&directionPass&&axes.every(c=>c.pass)&&combinations.every(c=>c.pass)&&regressions.every(c=>c.pass)&&blinkCombinations.every(c=>c.pass)&&returnResidual<.001,limitations:['Original blink contour remains too flat','Underpaint patches and iris art remain drafts','No Windows acceptance for this candidate']};
 const show=()=>document.getElementById('report').textContent=JSON.stringify(report,null,2);show();document.getElementById('summary').textContent=(report.pass?'PASS':'FAIL')+'：双轴视线、斜向叠加、眨眼隔离与已有形态回归。';
 function render(x=0,y=0,open=1){const snapshot=presentation.snapshot(0,{motion:'full',inputMode:'keyboard_mouse',autoSleepMinutes:0});snapshot.idle.gazeX=x;snapshot.idle.gazeY=y;snapshot.idle.blink=1-open;adapter.update(snapshot);}
 for(const[id,v]of Object.entries({neutral:[0,0,1],left:[-1,0,1],right:[1,0,1],up:[0,-1,1],down:[0,1,1],diagonal:[1,1,.5]}))document.getElementById(id).onclick=async()=>{render(...v);await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));const s=backend.getParameterSnapshot();report.semanticChecks??={};report.semanticChecks[id]={screenInput:{x:v[0],y:v[1]},cubism:{x:s.ParamEyeBallX,y:s.ParamEyeBallY,left:s.ParamEyeLOpen,right:s.ParamEyeROpen},pass:Math.abs(s.ParamEyeBallX-v[0])<.001&&Math.abs(s.ParamEyeBallY+v[1])<.001&&Math.abs(s.ParamEyeLOpen-v[2])<.001&&Math.abs(s.ParamEyeROpen-v[2])<.001};show();};render();
 document.getElementById('animate').onclick=async()=>{const button=document.getElementById('animate');button.disabled=true;const start=performance.now();let frames=0,min=1,max=0;await new Promise(resolve=>{const frame=now=>{const t=(now-start)/1000,p=t%1,v=p<.15?1-p/.15:p<.3?(p-.15)/.15:1;render(Math.sin(t*Math.PI),Math.cos(t*Math.PI),v);const s=backend.getParameterSnapshot();min=Math.min(min,s.ParamEyeLOpen);max=Math.max(max,s.ParamEyeLOpen);frames++;if(t<4)requestAnimationFrame(frame);else resolve();};requestAnimationFrame(frame);});render();await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));const s=backend.getParameterSnapshot();report.runtime={frames,elapsedSeconds:(performance.now()-start)/1000,observedEyeRange:[min,max],final:{x:s.ParamEyeBallX,y:s.ParamEyeBallY,left:s.ParamEyeLOpen,right:s.ParamEyeROpen},pass:frames>10&&min<.1&&max>.9&&s.ParamEyeBallX===0&&s.ParamEyeBallY===0&&s.ParamEyeLOpen===1&&s.ParamEyeROpen===1};show();document.getElementById('runtime').textContent=(report.runtime.pass?'PASS':'FAIL')+'：视线与四轮眨眼实际连续渲染并复位。';button.disabled=false;};
 moc.deleteModel(model);moc.release();previousMoc.deleteModel(previousModel);previousMoc.release();
}catch(error){document.getElementById('summary').textContent='ERROR: '+error.message;document.getElementById('report').textContent=String(error.stack||error);}
</script></html>
