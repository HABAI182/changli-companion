<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" /><title>长离 · 双手绑定草稿校验</title>
  <style>
    body {
      background: #fff6f2;
      color: #543b39;
      font: 16px system-ui;
      text-align: center;
    }
    canvas {
      width: min(80vw, 650px);
      height: min(80vw, 650px);
    }
    output {
      display: block;
      white-space: pre-wrap;
      max-width: 900px;
      margin: 12px auto;
    }
    button {
      padding: 10px;
      margin: 5px;
    }
  </style>
  <h1>长离 · 双手绑定草稿</h1>
  <p>真实 Cubism Editor 导出。补绘与双手仍需精修；头发、凤凰尚未独立绑定，暂不启用整体摆动。</p>
  <canvas id="model" width="800" height="800"></canvas>
  <div>
    <button data-hand="ParamHandLeftPress">左手按压</button
    ><button data-hand="ParamHandRightPress">右手按压</button><button id="reset">双手归位</button>
  </div>
  <div>
    <button data-motion="LeftPress">播放左手按压</button
    ><button data-motion="RightPress">播放右手按压</button>
  </div>
  <output id="report">加载及数据校验中…</output>
  <output id="motion-report">短动作尚未采样</output>
  <script type="module">
    import { loadCubismCore } from '/src/renderer/live2d/CoreLoader.ts';
    const root = '/models/changli/live-hands-draft/';
    const out = document.getElementById('report');
    try {
      await loadCubismCore();
      const { CubismBackend } = await import('/src/renderer/live2d/CubismBackend.ts');
      const backend = new CubismBackend();
      await backend.load(document.getElementById('model'), root + 'ChangliHands.model3.json');
      backend.resize(800, 800);
      const moc = Live2DCubismCore.Moc.fromArrayBuffer(
        await (await fetch(root + 'ChangliHands.moc3')).arrayBuffer(),
      );
      const model = Live2DCubismCore.Model.fromMoc(moc);
      try {
        const set = (id, v) => {
          const i = model.parameters.ids.indexOf(id);
          if (i < 0) throw Error('缺少 ' + id);
          model.parameters.values[i] = v;
          model.update();
        };
        const snap = () => model.drawables.vertexPositions.map((v) => [...v]);
        model.update();
        const initial = snap();
        const changed = () =>
          snap().flatMap((v, i) =>
            v.some((x, j) => Math.abs(x - initial[i][j]) > 1e-5) ? [model.drawables.ids[i]] : [],
          );
        const report = {
          artMeshes: model.drawables.count,
          parameters: model.parameters.count,
          handChecks: [],
        };
        for (const [id, mesh] of [
          ['ParamHandRightPress', 'ArtMesh0'],
          ['ParamHandLeftPress', 'ArtMesh1'],
        ]) {
          set(id, 30);
          const moved = changed();
          set(id, 0);
          const restored = changed().length === 0;
          if (moved.length !== 1 || moved[0] !== mesh || !restored)
            throw Error(JSON.stringify({ id, moved, restored }));
          report.handChecks.push({ id, moved, restored });
        }
        const opacity = [...model.drawables.opacities];
        for (const id of ['ParamEyeLOpen', 'ParamEyeROpen']) {
          set(id, 0);
          if (
            [...model.drawables.opacities].filter((v, i) => Math.abs(v - opacity[i]) > 0.9)
              .length !== 1
          )
            throw Error('眼睛校验失败');
          set(id, 1);
        }
        set('ParamMouthOpenY', 1);
        report.mouthChanges = changed();
        set('ParamMouthOpenY', 0);
        if (report.mouthChanges.length !== 1 || changed().length) throw Error('嘴部校验失败');
        out.textContent = '数据校验通过：' + JSON.stringify(report, null, 2);
      } finally {
        model.release();
        moc._release();
      }
      document
        .querySelectorAll('[data-hand]')
        .forEach((b) => (b.onclick = () => backend.setParameter(b.dataset.hand, 30)));
      document.getElementById('reset').onclick = () => {
        backend.setParameter('ParamHandLeftPress', 0);
        backend.setParameter('ParamHandRightPress', 0);
      };
      document.querySelectorAll('[data-motion]').forEach(
        (b) =>
          (b.onclick = () => {
            backend.setParameter('ParamHandLeftPress', 0);
            backend.setParameter('ParamHandRightPress', 0);
            backend.startMotion(b.dataset.motion);
            const start = performance.now(),
              ranges = { ParamHandLeftPress: [0, 0], ParamHandRightPress: [0, 0] };
            document.querySelectorAll('button').forEach((x) => (x.disabled = true));
            const sample = () => {
              const values = backend.getParameterSnapshot();
              for (const id of Object.keys(ranges)) {
                ranges[id][0] = Math.min(ranges[id][0], values[id]);
                ranges[id][1] = Math.max(ranges[id][1], values[id]);
              }
              if (performance.now() - start < 650) {
                requestAnimationFrame(sample);
                return;
              }
              document.getElementById('motion-report').textContent = JSON.stringify(
                { motion: b.dataset.motion, ranges, rest: backend.getParameterSnapshot() },
                null,
                2,
              );
              document.querySelectorAll('button').forEach((x) => (x.disabled = false));
            };
            requestAnimationFrame(sample);
          }),
      );
      // CubismBackend owns its frame loop after load().
      addEventListener('pagehide', () => backend.dispose(), { once: true });
    } catch (error) {
      out.textContent = '校验失败：' + error.message;
      console.error(error);
    }
  </script>
</html>
