<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>长离 · 头部与桌面独立核对</title>
<style>body{background:#fff6f2;color:#543b39;font:16px system-ui;text-align:center}canvas{width:min(75vw,55vh,650px);height:min(75vw,55vh,650px)}button{padding:10px;margin:5px}pre{max-width:1000px;margin:auto;text-align:left;white-space:pre-wrap}</style>
<h1>头部与桌面分离 · 隔离候选</h1>
<p>键盘与双手从整体倾斜中分离。当前水平切分仍需检查发梢与颈部接缝；不作为正式美术成品。</p>
<canvas id="model" width="800" height="800"></canvas>
<div><button id="minus">左倾</button><button id="zero">回正</button><button id="plus">右倾</button><button id="press">右倾＋双手按压</button><button id="half">半闭眼</button></div>
<p id="summary">读取真实 Cubism Core…</p><details><summary>验证数据</summary><pre id="report"></pre></details>
<script type="module">
import {loadCubismCore} from '/src/renderer/live2d/CoreLoader.ts';
try {
 await loadCubismCore();
 const {CubismMoc}=await import('/vendor/live2d/src/model/cubismmoc.ts');
 const {CubismBackend}=await import('/src/renderer/live2d/CubismBackend.ts');
 const root='/models/changli/live-head-split-v1-candidate/', name='ChangliHeadSplitV1';
 const backend=new CubismBackend();
 await backend.load(document.getElementById('model'),root+name+'.model3.json');backend.resize(800,800);
 const moc=CubismMoc.create(await(await fetch(root+name+'.moc3')).arrayBuffer(),true), model=moc.createModel(), core=model.getModel(), ppu=model.getPixelsPerUnit();
 const oldMoc=CubismMoc.create(await(await fetch('/models/changli/live-eye-deform-v1-candidate/ChangliEyeDeformV1.moc3')).arrayBuffer(),true), oldModel=oldMoc.createModel(), old=oldModel.getModel();
 const ids=[...core.drawables.ids], params=[...core.parameters.ids];
 function set(c,p={}){c.parameters.values.set(c.parameters.defaultValues);for(const[id,v]of Object.entries(p)){const i=c.parameters.ids.indexOf(id);if(i<0)throw Error('Missing '+id);c.parameters.values[i]=v;}c.update();return c.drawables.vertexPositions.map(v=>[...v]);}
 const base=set(core), diff=(a,b)=>Math.max(0,...a.map((v,i)=>Math.abs(v-b[i])*ppu));
 const at=id=>{const i=ids.indexOf(id);if(i<0)throw Error('Missing drawable '+id);return i;};
 const fixedIds=['ArtMesh20','ArtMesh9','ArtMesh10'];fixedIds.forEach(at);
 const tilt=[-30,-15,0,15,30].map(value=>{const pos=set(core,{ParamAngleZ:value});return {value,changed:ids.filter((id,i)=>diff(pos[i],base[i])>.001),fixed:fixedIds.map(id=>({id,maxShiftPixels:diff(pos[at(id)],base[at(id)])}))};});
 const handCases=[['ParamHandLeftPress','ArtMesh10'],['ParamHandRightPress','ArtMesh9']].map(([param,id])=>{const neutral=set(core,{[param]:30}), tilted=set(core,{[param]:30,ParamAngleZ:30});return {param,id,changed:ids.filter((id,i)=>diff(neutral[i],base[i])>.001),pressPixels:diff(neutral[at(id)],base[at(id)]),tiltDifferencePixels:diff(neutral[at(id)],tilted[at(id)])};});
 const regressionCases=[{}, {ParamEyeLOpen:.5,ParamEyeROpen:.25},{ParamBangCenterSway:1,ParamOrnamentLeftSway:1,ParamSideHairRightSway:1,ParamSideHairLeftSway:-1,ParamHandLeftPress:30,ParamHandRightPress:30,ParamPhoenixSway:30,ParamPhoenixWingSway:30,ParamPhoenixTailSway:30}];
 const regressions=regressionCases.map(p=>{const a=set(core,p),b=set(old,p);let max=0;for(let i=0;i<ids.length;i++){if(ids[i]==='ArtMesh18'||ids[i]==='ArtMesh20')continue;const j=old.drawables.ids.indexOf(ids[i]);if(j<0||a[i].length!==b[j].length)throw Error('Changed unrelated topology');max=Math.max(max,diff(a[i],b[j]));}return {params:p,maxDifferencePixels:max,pass:max<.001};});
 const bounds=id=>{const v=base[at(id)],x=v.filter((_,i)=>i%2===0),y=v.filter((_,i)=>i%2===1);return {minX:Math.min(...x)*ppu,maxX:Math.max(...x)*ppu,minY:Math.min(...y)*ppu,maxY:Math.max(...y)*ppu,uv:[...core.drawables.vertexUvs[at(id)]],texture:core.drawables.textureIndices[at(id)]};};
 const head=bounds('ArtMesh18'),desk=bounds('ArtMesh20'),signedEdgeGapPixels=head.minY-desk.maxY;
 // Cropping must retain the original bitmap mapping rather than stretch it.
 const oldBase=set(old), oldIndex=old.drawables.ids.indexOf('ArtMesh18'),oldUV=[...old.drawables.vertexUvs[oldIndex]],oldVertices=oldBase[oldIndex];
 let uvMappingErrorPixels=0;
 for(const id of ['ArtMesh18','ArtMesh20'])for(let axis=0;axis<2;axis++){
  const uvAxis=oldUV.filter((_,i)=>i%2===axis),vAxis=oldVertices.filter((_,i)=>i%2===axis),lo=Math.min(...uvAxis),hi=Math.max(...uvAxis),vLo=Math.min(...vAxis),vHi=Math.max(...vAxis),uv=core.drawables.vertexUvs[at(id)],v=base[at(id)];
  for(let i=axis;i<v.length;i+=2)uvMappingErrorPixels=Math.max(uvMappingErrorPixels,Math.abs(v[i]-(vLo+(uv[i]-lo)/(hi-lo)*(vHi-vLo)))*ppu);
 }
 const uvHead=head.uv.filter((_,i)=>i%2===1),uvDesk=desk.uv.filter((_,i)=>i%2===1),uvEdgeOverlap=Math.max(...uvDesk)-Math.min(...uvHead);
 set(core,{ParamAngleZ:-30,ParamHandLeftPress:30,ParamEyeROpen:0});const returned=set(core),returnResidual=Math.max(...returned.map((v,i)=>diff(v,base[i])));
 const report={candidate:name,officialCore:true,drawables:ids.length,parameters:params.length,tilt,handCases,regressions,split:{head,desk,signedEdgeGapPixels,uvEdgeOverlap,uvMappingErrorPixels},returnResidual,pass:tilt.every(r=>r.fixed.every(x=>x.maxShiftPixels<.001))&&tilt.filter(r=>r.value!==0).every(r=>r.changed.length===10)&&handCases.every(r=>r.changed.length===1&&r.changed[0]===r.id&&r.pressPixels>10&&r.tiltDifferencePixels<.001)&&regressions.every(r=>r.pass)&&signedEdgeGapPixels<=0&&signedEdgeGapPixels>-3&&head.texture===desk.texture&&uvEdgeOverlap>=0&&uvEdgeOverlap<3/2048&&uvMappingErrorPixels<.001&&returnResidual<.001,limitations:['Horizontal split leaves some lower hair in desk painting','Existing rotation pivot inherited; no new neck pivot','Eye ghosting and formal eyelid/iris art still unresolved','No default or Windows package change']};
 document.getElementById('report').textContent=JSON.stringify(report,null,2);document.getElementById('summary').textContent=(report.pass?'PASS':'FAIL')+'：头部倾斜、固定键盘/双手、原绑定回归与切分坐标核对。';
 const render=(z=0,hand=0,eye=1)=>{backend.setParameter('ParamAngleZ',z);backend.setParameter('ParamHandLeftPress',hand);backend.setParameter('ParamHandRightPress',hand);backend.setParameter('ParamEyeLOpen',eye);backend.setParameter('ParamEyeROpen',eye);};
 for(const[id,p]of Object.entries({minus:[-30],zero:[0],plus:[30],press:[30,30],half:[0,0,.5]}))document.getElementById(id).onclick=()=>render(...p);render();
 moc.deleteModel(model);moc.release();oldMoc.deleteModel(oldModel);oldMoc.release();
}catch(error){document.getElementById('summary').textContent='ERROR: '+error.message;document.getElementById('report').textContent=String(error.stack||error);}
</script></html>
