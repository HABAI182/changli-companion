<!doctype html><html lang="zh"><meta charset="utf-8"><title>输入与眨眼真实 SDK 验证</title>
<style>body{margin:0;background:#21323d;color:#eee;font:14px sans-serif}canvas{width:800px;height:800px;display:block}pre{position:absolute;left:820px;top:0;white-space:pre-wrap;width:470px}</style>
<canvas id="canvas"></canvas><pre id="status">加载中</pre>
<script type="module">
import {model} from '/src/model.ts';
import {PresentationRuntime} from '/src/pet/presentation.ts';
import {Live2DAdapter} from '/src/renderer/live2d/Live2DAdapter.ts';
import {loadCubismCore} from '/src/renderer/live2d/CoreLoader.ts';
await loadCubismCore();
const {CubismBackend}=await import('/src/renderer/live2d/CubismBackend.ts');
const candidateVersion=Number(new URLSearchParams(location.search).get('candidate'));
if(candidateVersion && ![69,70,71].includes(candidateVersion))throw Error('Unsupported isolated candidate');
const config=candidateVersion?{...model.renderer.live2d,entry:`live-reference-repair-v${candidateVersion}-candidate/ChangliReferenceRepairV${candidateVersion}-physics.model3.json`}:model.renderer.live2d;
const backend=new CubismBackend(),adapter=new Live2DAdapter(config,backend);
let pet=new PresentationRuntime(0,()=>0),time=0,frozen=true;
const settings={motion:'full',inputMode:'keyboard_mouse',autoSleepMinutes:0};
function update(){let s=pet.snapshot(frozen?time:performance.now(),settings);s.idle.gazeX=0;s.idle.gazeY=0;
 s.idle.headTilt=0;s.idle.headTurn=0;s.idle.hairSway=0;s.idle.ornamentSway=0;s.idle.phoenixFloat=0;
 adapter.update(s);requestAnimationFrame(update);}
try{
 if(await adapter.init(document.querySelector('canvas'))!=='ready')throw Error(adapter.error);
 adapter.resize(800,800);update();
 window.inputBlinkQa={backend,settings,modelEntry:config.entry,candidateVersion,
  freeze(t){time=t;frozen=true;},
  live(mode='keyboard_mouse'){pet=new PresentationRuntime(performance.now(),()=>0);settings.inputMode=mode;frozen=false;},
  input(signal){pet.input(signal,performance.now(),0,0,settings.inputMode);},
  get(){return backend.getParameterSnapshot();},geometry(){return backend.getDrawableSnapshot();}};
 document.querySelector('#status').textContent='官方 Core 已加载；此页只用于浏览器验证，不是 Windows 实机验收。';
}catch(e){document.querySelector('#status').textContent=String(e.stack);}
</script></html>
