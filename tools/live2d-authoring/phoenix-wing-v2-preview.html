<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" />
  <title>长离 · 凤凰翅膀 v2 隔离验收</title>
  <style>
    body {
      margin: 16px;
      background: #fff6f2;
      color: #543b39;
      font: 16px system-ui;
      text-align: center;
    }
    canvas {
      width: min(80vw, 60vh, 650px);
      height: min(80vw, 60vh, 650px);
    }
    button {
      padding: 10px 14px;
      margin: 5px;
    }
    output {
      display: block;
      white-space: pre-wrap;
      max-width: 900px;
      margin: 12px auto;
      text-align: left;
    }
  </style>
  <h1>长离 · 凤凰翅膀 v2 候选</h1>
  <p>官方 Cubism Editor MOC3；凤凰美术仍是可替换草稿。此页只用于浏览器制作核对。</p>
  <canvas id="model" width="800" height="800"></canvas>
  <div>
    <button id="minus">翅膀 -30</button><button id="center">归零</button
    ><button id="plus">翅膀 +30</button>
    <button id="impulse">物理回弹</button>
  </div>
  <output id="mode">静态关键形态检查（暂不启用物理覆盖）</output>
  <output id="runtime-report">物理回弹采样 20 秒动画时间；后台节流时墙钟时间会更长。</output>
  <output id="report">正在读取 Cubism Core…</output>
  <details>
    <summary>完整参数绑定审计</summary>
    <output id="audit-data"></output>
  </details>
  <script type="module">
    import { loadCubismCore } from '/src/renderer/live2d/CoreLoader.ts';

    const root = '/models/changli/live-phoenix-wing-v2-candidate/';
    const name = 'ChangliPhoenixWingV2';
    const report = document.getElementById('report');
    try {
      await loadCubismCore();
      const { CubismBackend } = await import('/src/renderer/live2d/CubismBackend.ts');
      const { CubismMoc } = await import('/vendor/live2d/src/model/cubismmoc.ts');
      const { CubismPhysics } = await import('/vendor/live2d/src/physics/cubismphysics.ts');
      let backend;
      let mode;
      let runtimeRunId = 0;
      const loadPreview = async (nextMode) => {
        runtimeRunId++;
        backend?.dispose();
        backend = new CubismBackend();
        mode = nextMode;
        await backend.load(
          document.getElementById('model'),
          root + name + (mode === 'manual' ? '-manual' : '') + '.model3.json',
        );
        backend.resize(800, 800);
      };
      await loadPreview('manual');
      const mocBytes = await (await fetch(root + name + '.moc3')).arrayBuffer();
      const moc = CubismMoc.create(mocBytes, true);
      const model = moc.createModel();
      const core = model.getModel();
      const ids = core.parameters.ids;
      const wing = ids.indexOf('ParamPhoenixWingSway');
      const tail = ids.indexOf('ParamPhoenixTailSway');
      if (wing < 0 || tail < 0) throw Error('凤凰翅膀或尾羽参数未导出');
      const snapshot = () => core.drawables.vertexPositions.map((vertices) => [...vertices]);
      core.parameters.values[wing] = 0;
      core.parameters.values[tail] = 0;
      core.update();
      const base = snapshot();
      const moved = () =>
        snapshot().flatMap((vertices, i) =>
          vertices.some((value, j) => Math.abs(value - base[i][j]) > 1e-5)
            ? [core.drawables.ids[i]]
            : [],
        );
      const check = (index, value) => {
        core.parameters.values[index] = value;
        core.update();
        const meshes = moved();
        core.parameters.values[index] = 0;
        core.update();
        if (moved().length) throw Error('参数归零后网格未恢复');
        return meshes;
      };
      const wingMesh = core.drawables.ids.indexOf('ArtMesh15');
      if (wingMesh < 0) throw Error('缺少凤凰翅膀 ArtMesh15');
      // Measure the exported geometry rather than relying on Editor labels.
      const wingRotation = (value) => {
        core.parameters.values[wing] = value;
        core.update();
        const from = base[wingMesh];
        const to = snapshot()[wingMesh];
        const centroid = (vertices) =>
          [0, 1].map(
            (axis) =>
              vertices.filter((_, i) => i % 2 === axis).reduce((a, b) => a + b, 0) /
              (vertices.length / 2),
          );
        const a = centroid(from),
          b = centroid(to);
        let dot = 0,
          cross = 0;
        for (let i = 0; i < from.length; i += 2) {
          const x = from[i] - a[0],
            y = from[i + 1] - a[1];
          const u = to[i] - b[0],
            v = to[i + 1] - b[1];
          dot += x * u + y * v;
          cross += x * v - y * u;
        }
        core.parameters.values[wing] = 0;
        core.update();
        return (Math.atan2(cross, dot) * 180) / Math.PI;
      };
      const rotations = { minus: wingRotation(-30), plus: wingRotation(30) };
      if (
        rotations.minus * rotations.plus >= 0 ||
        Math.min(Math.abs(rotations.minus), Math.abs(rotations.plus)) < 10
      )
        throw Error('翅膀导出的两端不是双向约 12 度形态');
      const wingMinus = check(wing, -30);
      const wingPlus = check(wing, 30);
      const tailPlus = check(tail, 30);
      if (
        wingMinus.length !== 1 ||
        wingPlus.length !== 1 ||
        wingMinus[0] !== wingPlus[0] ||
        tailPlus.length !== 1 ||
        tailPlus[0] === wingPlus[0]
      )
        throw Error('翅膀与尾羽未独立绑定：' + JSON.stringify({ wingMinus, wingPlus, tailPlus }));

      const manifest = await (await fetch(root + name + '.model3.json')).json();
      const physicsUrl = root + manifest.FileReferences.Physics;
      const physicsData = await (await fetch(physicsUrl)).arrayBuffer();
      const physics = CubismPhysics.create(physicsData, physicsData.byteLength);
      const ranges = { wing: [0, 0], tail: [0, 0] };
      const angle = ids.indexOf('ParamAngleX');
      if (angle < 0) throw Error('缺少物理输入 ParamAngleX');
      physics.stabilization(model);
      model.update();
      const settledBase = snapshot();
      for (let frame = 0; frame < 1200; frame++) {
        core.parameters.values[angle] = frame < 12 ? 0 : frame < 30 ? 30 : frame < 48 ? -30 : 0;
        physics.evaluate(model, 1 / 60);
        model.update();
        for (const [key, index] of [
          ['wing', wing],
          ['tail', tail],
        ]) {
          const value = core.parameters.values[index];
          if (!Number.isFinite(value) || Math.abs(value) > 30.001)
            throw Error(key + ' 物理输出越界：' + value);
          ranges[key][0] = Math.min(ranges[key][0], value);
          ranges[key][1] = Math.max(ranges[key][1], value);
        }
      }
      if (ranges.wing[0] >= -0.1 || ranges.wing[1] <= 0.1) throw Error('翅膀物理未产生双向输出');
      const finalPositions = snapshot();
      const residualPixels = Math.max(
        ...finalPositions.flatMap((vertices, i) =>
          vertices.map(
            (value, j) => Math.abs(value - settledBase[i][j]) * model.getPixelsPerUnit(),
          ),
        ),
      );
      if (residualPixels > 0.25) throw Error('物理稳定后的画面残差超过 0.25 源像素');
      const physicsFinal = Object.fromEntries(
        [
          'ParamAngleX',
          ...JSON.parse(new TextDecoder().decode(physicsData)).PhysicsSettings.map(
            (setting) => setting.Output[0].Destination.Id,
          ),
        ].map((id) => [id, core.parameters.values[ids.indexOf(id)]]),
      );
      // Standard parameters can exist in a MOC without any visible binding.
      // Audit both geometry and opacity so an eye fade is not marked inactive.
      core.parameters.values.set(core.parameters.defaultValues);
      core.update();
      const auditPositions = snapshot();
      const auditOpacities = [...core.drawables.opacities];
      const parameterAudit = ids.map((id, index) => {
        const endpoints = [
          core.parameters.minimumValues[index],
          core.parameters.maximumValues[index],
        ];
        const affected = endpoints.map((value) => {
          core.parameters.values[index] = value;
          core.update();
          const positions = snapshot();
          const meshes = positions.flatMap((vertices, i) => {
            if (!vertices.every(Number.isFinite)) throw Error(id + ' 产生非有限顶点');
            return vertices.some((v, j) => Math.abs(v - auditPositions[i][j]) > 1e-5) ||
              Math.abs(core.drawables.opacities[i] - auditOpacities[i]) > 1e-5
              ? [core.drawables.ids[i]]
              : [];
          });
          core.parameters.values[index] = core.parameters.defaultValues[index];
          core.update();
          return { value, meshes };
        });
        return {
          id,
          endpoints,
          affected,
          visibleBinding: affected.some((endpoint) => endpoint.meshes.length > 0),
        };
      });
      const unboundParameters = parameterAudit
        .filter((row) => !row.visibleBinding)
        .map((row) => row.id);
      const result = {
        status: 'PASS',
        artMeshes: core.drawables.count,
        parameters: core.parameters.count,
        textures: manifest.FileReferences.Textures.length,
        wingMinus,
        wingPlus,
        tailPlus,
        wingRotationsDegrees: rotations,
        physicsRanges: ranges,
        physicsFinal,
        residualPixels,
        physicsSettings: 6,
        fixedFrames: 1200,
        activeParameters: parameterAudit.filter((row) => row.visibleBinding).length,
        unboundParameters,
        parameterAudit,
        candidateOnly: true,
      };
      const { parameterAudit: auditRows, ...summary } = result;
      report.textContent = JSON.stringify(summary, null, 2);
      document.getElementById('audit-data').textContent = JSON.stringify(result, null, 2);
      window.phoenixWingV2Verification = result;
      const controls = [...document.querySelectorAll('button')];
      const act = async (value) => {
        runtimeRunId++;
        controls.forEach((button) => (button.disabled = true));
        try {
          if (mode !== 'manual') await loadPreview('manual');
          backend.setParameter('ParamPhoenixWingSway', value);
          document.getElementById('mode').textContent = '静态翅膀参数：' + value + '（物理关闭）';
        } catch (error) {
          document.getElementById('mode').textContent = '预览失败：' + error;
        } finally {
          controls.forEach((button) => (button.disabled = false));
        }
      };
      document.getElementById('minus').onclick = () => act(-30);
      document.getElementById('center').onclick = () => act(0);
      document.getElementById('plus').onclick = () => act(30);
      document.getElementById('impulse').onclick = async () => {
        controls.forEach((button) => (button.disabled = true));
        try {
          if (mode !== 'physics') await loadPreview('physics');
          const run = ++runtimeRunId;
          backend.setParameter('ParamAngleX', 30);
          document.getElementById('mode').textContent =
            '物理输入 +30 → -30 → 0（六组物理；前 0.6 秒动画时间施加扰动）';
          const started = performance.now();
          let previousSample = started;
          let animationSeconds = 0;
          let released = false;
          let reversed = false;
          const liveRanges = { wing: [0, 0], tail: [0, 0] };
          let samples = 0;
          const sample = (now) => {
            if (run !== runtimeRunId) {
              document.getElementById('runtime-report').textContent =
                '采样已被新的预览操作中断；不计为通过。';
              return;
            }
            const values = backend.getParameterSnapshot();
            // Match CubismBackend.draw's delta clamp: a throttled frame does
            // not advance the simulation by the entire wall-clock gap.
            animationSeconds += Math.min((now - previousSample) / 1000, 0.1);
            previousSample = now;
            samples++;
            for (const [key, id] of [
              ['wing', 'ParamPhoenixWingSway'],
              ['tail', 'ParamPhoenixTailSway'],
            ]) {
              if (!Number.isFinite(values[id]) || Math.abs(values[id]) > 30.001) {
                document.getElementById('runtime-report').textContent =
                  'FAIL：实际物理输出非有限或越界';
                return;
              }
              liveRanges[key][0] = Math.min(liveRanges[key][0], values[id]);
              liveRanges[key][1] = Math.max(liveRanges[key][1], values[id]);
            }
            if (!reversed && animationSeconds >= 0.3) {
              backend.setParameter('ParamAngleX', -30);
              reversed = true;
            }
            if (!released && animationSeconds >= 0.6) {
              backend.setParameter('ParamAngleX', 0);
              released = true;
              document.getElementById('mode').textContent = '物理输入已归零，观察回弹';
            }
            if (animationSeconds < 20) {
              document.getElementById('runtime-report').textContent =
                '正在采样实际渲染器：' +
                samples +
                ' 帧，动画时间 ' +
                animationSeconds.toFixed(2) +
                ' 秒';
              requestAnimationFrame(sample);
              return;
            }
            const final = Object.fromEntries(
              [
                'ParamAngleX',
                'ParamHairFront',
                'ParamHairSide',
                'ParamSideHairRightSway',
                'ParamSideHairLeftSway',
                'ParamPhoenixWingSway',
                'ParamPhoenixTailSway',
              ].map((id) => [id, values[id]]),
            );
            // Accept a visual tolerance, not falsely demand exact numerical
            // zero from an SDK particle system with a movement threshold.
            const liveMoc = CubismMoc.create(mocBytes, true);
            const liveModel = liveMoc.createModel();
            const liveCore = liveModel.getModel();
            liveCore.parameters.values.set(liveCore.parameters.defaultValues);
            liveCore.update();
            const restVertices = liveCore.drawables.vertexPositions.map((vertices) => [
              ...vertices,
            ]);
            for (const [id, value] of Object.entries(values)) {
              const index = liveCore.parameters.ids.indexOf(id);
              if (index >= 0) liveCore.parameters.values[index] = value;
            }
            liveCore.update();
            const liveResidualPixels = Math.max(
              ...liveCore.drawables.vertexPositions.flatMap((vertices, i) =>
                [...vertices].map(
                  (value, j) => Math.abs(value - restVertices[i][j]) * liveModel.getPixelsPerUnit(),
                ),
              ),
            );
            liveMoc.deleteModel(liveModel);
            liveMoc.release();
            const passed =
              samples >= 60 &&
              final.ParamAngleX === 0 &&
              Number.isFinite(liveResidualPixels) &&
              liveResidualPixels <= 0.25 &&
              Object.values(liveRanges).every((range) => range[0] < -0.1 && range[1] > 0.1);
            result.renderedImpulse = {
              status: passed ? 'PASS' : 'FAIL',
              samples,
              animationSeconds,
              elapsedMs: performance.now() - started,
              ranges: liveRanges,
              final,
              residualPixels: liveResidualPixels,
              residualTolerancePixels: 0.25,
            };
            document.getElementById('runtime-report').textContent = JSON.stringify(
              result.renderedImpulse,
              null,
              2,
            );
            document.getElementById('audit-data').textContent = JSON.stringify(result, null, 2);
          };
          document.getElementById('runtime-report').textContent = '正在采样实际渲染器…';
          requestAnimationFrame(sample);
        } catch (error) {
          document.getElementById('mode').textContent = '预览失败：' + error;
        } finally {
          controls.forEach((button) => (button.disabled = false));
        }
      };
      physics.release();
      moc.deleteModel(model);
      moc.release();
      window.addEventListener(
        'pagehide',
        () => {
          runtimeRunId++;
          backend.dispose();
        },
        { once: true },
      );
    } catch (error) {
      report.textContent = 'FAIL: ' + (error?.stack || error);
      window.phoenixWingV2Verification = { status: 'FAIL', error: String(error) };
    }
  </script>
</html>
