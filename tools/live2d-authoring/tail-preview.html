<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" /><title>长离 · 尾羽制作预览</title>
  <style>
    body {
      background: #fff6f2;
      color: #543b39;
      font: 16px system-ui;
      text-align: center;
    }
    canvas {
      width: min(80vw, 650px);
      height: min(80vw, 650px);
    }
    button {
      padding: 10px;
      margin: 5px;
    }
    output {
      display: block;
      white-space: pre-wrap;
      max-width: 920px;
      margin: 12px auto;
      text-align: left;
      max-height: 260px;
      overflow: auto;
    }
  </style>
  <h1>长离 · 独立凤凰尾羽制作预览</h1>
  <p>
    真实 Cubism Editor 导出，局部物理初稿。尾羽轮廓、袖口和完整发束仍需精修；浏览器预览不代表
    Windows 桌宠验收。
  </p>
  <canvas id="model" width="800" height="800"></canvas>
  <div>
    <button id="impulse">播放局部物理回弹</button><button data-motion="LeftPress">左手按压</button
    ><button data-motion="RightPress">右手按压</button>
  </div>
  <details>
    <summary>查看模型校验记录</summary>
    <output id="report">模型及物理检查中…</output>
    <output id="motion-report">尚未播放物理动作</output>
  </details>
  <script type="module">
    import { loadCubismCore } from '/src/renderer/live2d/CoreLoader.ts';
    const root = '/models/changli/live-tail-draft/';
    const outputs = ['ParamHairFront', 'ParamHairSide', 'ParamPhoenixTailSway'];
    const expected = ['ArtMesh4', 'ArtMesh3', 'ArtMesh8'];
    const report = document.getElementById('report');
    try {
      await loadCubismCore();
      const { CubismBackend } = await import('/src/renderer/live2d/CubismBackend.ts');
      const { CubismMoc } = await import('/vendor/live2d/src/model/cubismmoc.ts');
      const { CubismPhysics } = await import('/vendor/live2d/src/physics/cubismphysics.ts');
      const backend = new CubismBackend();
      await backend.load(document.getElementById('model'), root + 'ChangliTail.model3.json');
      backend.resize(800, 800);
      const moc = CubismMoc.create(
        await (await fetch(root + 'ChangliTail.moc3')).arrayBuffer(),
        true,
      );
      const fm = moc.createModel(),
        core = fm.getModel();
      const physicsData = await (await fetch(root + 'tail.physics3.json')).arrayBuffer();
      const physics = CubismPhysics.create(physicsData, physicsData.byteLength);
      try {
        const set = (id, value) => {
          const i = core.parameters.ids.indexOf(id);
          if (i < 0) throw Error('Missing ' + id);
          core.parameters.values[i] = value;
          core.update();
        };
        const snap = () => core.drawables.vertexPositions.map((v) => [...v]);
        core.update();
        const initial = snap();
        const changed = () =>
          snap().flatMap((v, i) =>
            v.some((x, j) => Math.abs(x - initial[i][j]) > 1e-5) ? [core.drawables.ids[i]] : [],
          );
        const result = {
          artMeshes: core.drawables.count,
          parameters: core.parameters.count,
          bindings: [],
          physics: { ranges: {}, afterReleasePeak: {}, settled: {} },
        };
        for (const [id, mesh, value] of [
          ...outputs.map((id, i) => [id, expected[i], i === 2 ? 30 : 1]),
          ['ParamHandRightPress', 'ArtMesh0', 30],
          ['ParamHandLeftPress', 'ArtMesh1', 30],
          ['ParamMouthOpenY', 'Mouth', 1],
        ]) {
          set(id, value);
          const moved = changed();
          let handAnchor;
          if (id.startsWith('ParamHand')) {
            const index = core.drawables.ids.indexOf(mesh);
            const ys = (v) => v.filter((_, i) => i % 2 === 1);
            const before = ys(initial[index]),
              after = ys(snap()[index]);
            handAnchor = {
              topShiftPixels: Math.abs(Math.max(...after) - Math.max(...before)) * 1254,
              bottomShiftPixels: Math.abs(Math.min(...after) - Math.min(...before)) * 1254,
            };
            if (handAnchor.topShiftPixels > 1 || handAnchor.bottomShiftPixels < 4)
              throw Error('Hand sleeve anchor failed ' + id + ': ' + JSON.stringify(handAnchor));
          }
          set(id, 0);
          const restored = changed().length === 0;
          if (moved.length !== 1 || moved[0] !== mesh || !restored)
            throw Error(JSON.stringify({ id, moved, restored }));
          result.bindings.push({ id, moved, restored, handAnchor });
        }
        const open = [...core.drawables.opacities];
        for (const id of ['ParamEyeLOpen', 'ParamEyeROpen']) {
          set(id, 0);
          if (
            [...core.drawables.opacities].filter((x, i) => Math.abs(x - open[i]) > 0.9).length !== 1
          )
            throw Error('Eye binding failed');
          set(id, 1);
        }
        physics.stabilization(fm);
        for (const id of outputs) {
          result.physics.ranges[id] = [0, 0];
          result.physics.afterReleasePeak[id] = 0;
        }
        const touched = new Set();
        for (let frame = 0; frame < 1200; frame++) {
          set('ParamAngleX', frame < 12 ? 0 : frame < 30 ? 30 : frame < 48 ? -30 : 0);
          physics.evaluate(fm, 1 / 60);
          fm.update();
          for (const mesh of changed()) touched.add(mesh);
          for (const id of outputs) {
            const v = core.parameters.values[core.parameters.ids.indexOf(id)];
            if (!Number.isFinite(v)) throw Error('Nonfinite ' + id);
            const range = result.physics.ranges[id];
            range[0] = Math.min(range[0], v);
            range[1] = Math.max(range[1], v);
            if (frame >= 48 && frame < 120)
              result.physics.afterReleasePeak[id] = Math.max(
                result.physics.afterReleasePeak[id],
                Math.abs(v),
              );
            if (frame === 1199) result.physics.settled[id] = v;
          }
        }
        result.physics.changedMeshes = [...touched];
        result.physics.settledMaxVertexPixels = Math.max(
          ...snap().flatMap((v, i) => v.map((x, j) => Math.abs(x - initial[i][j]) * 1254)),
        );
        // SDK particle threshold may leave a tiny nonzero parameter. Judge the
        // authored geometry too: settling must be under a quarter source pixel.
        if (result.physics.settledMaxVertexPixels > 0.25)
          throw Error('Visible settling error: ' + JSON.stringify(result));
        if ([...touched].some((id) => !expected.includes(id)) || touched.size !== 3)
          throw Error('Physics moved wrong meshes ' + JSON.stringify([...touched]));
        for (const id of outputs) {
          const range = result.physics.ranges[id];
          if (
            range[1] - range[0] < (id === 'ParamPhoenixTailSway' ? 0.1 : 0.01) ||
            result.physics.afterReleasePeak[id] < 0.001 ||
            Math.abs(result.physics.settled[id]) > (id === 'ParamPhoenixTailSway' ? 0.05 : 0.01)
          )
            throw Error('Impulse or settling failed ' + id + ': ' + JSON.stringify(result));
        }
        report.textContent = '模型与物理校验通过：' + JSON.stringify(result, null, 2);
      } finally {
        CubismPhysics.delete(physics);
        moc.deleteModel(fm);
        moc.release();
      }
      document
        .querySelectorAll('[data-motion]')
        .forEach((b) => (b.onclick = () => backend.startMotion(b.dataset.motion)));
      document.getElementById('impulse').onclick = () => {
        backend.startMotion('SecondaryImpulse');
        const start = performance.now();
        const ranges = Object.fromEntries(outputs.map((id) => [id, [0, 0]]));
        document.querySelectorAll('button').forEach((b) => (b.disabled = true));
        const sample = () => {
          const values = backend.getParameterSnapshot();
          for (const id of outputs) {
            ranges[id][0] = Math.min(ranges[id][0], values[id]);
            ranges[id][1] = Math.max(ranges[id][1], values[id]);
          }
          if (performance.now() - start < 8000) {
            requestAnimationFrame(sample);
            return;
          }
          document.getElementById('motion-report').textContent = JSON.stringify(
            { ranges, rest: backend.getParameterSnapshot() },
            null,
            2,
          );
          document.querySelectorAll('button').forEach((b) => (b.disabled = false));
        };
        requestAnimationFrame(sample);
      };
      addEventListener('pagehide', () => backend.dispose(), { once: true });
    } catch (error) {
      report.textContent = '校验失败：' + error.message;
      console.error(error);
    }
  </script>
</html>
